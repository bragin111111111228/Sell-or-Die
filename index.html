<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sell or Die</title>
<style>
:root{--bg:#f7f6f2;--fg:#111;--card:#fff;--line:#d9d6cc;--mut:#5f5d55;--red:#d4171e;--yel:#f2ff3a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101010;--fg:#f2f0ea;--card:#1b1b1b;--line:#343434;--mut:#a09d94;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101010;--fg:#f2f0ea;--card:#1b1b1b;--line:#343434;--mut:#a09d94;color-scheme:dark}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:500 16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
h1,h2{margin:0 0 6px;font-weight:800;line-height:1.15;letter-spacing:-.01em}
h1{font-size:24px}h2{font-size:22px}
main{flex:1;overflow-y:auto;padding:20px 18px 12px}
.scr{display:none}.scr.on{display:block}
.tag{color:var(--mut);margin:0 0 16px}
.small{font-size:14px;color:var(--mut)}
.item{font-size:clamp(28px,8.5vw,36px);font-weight:800;line-height:1.15;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--yel);border-radius:12px;padding:18px;margin:8px 0 18px}
.btn{display:block;width:100%;min-height:54px;border:2px solid var(--red);border-radius:14px;padding:12px 16px;font:inherit;font-weight:700;font-size:17px;background:var(--red);color:#fff;cursor:pointer;margin:10px 0}
.btn.g{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.g.sel{border-color:var(--fg);background:var(--fg);color:var(--bg)}
.btn.sm{min-height:44px;font-size:15px;margin:0;width:auto;flex:1}
.btn:disabled{opacity:.4}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.count{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;margin-bottom:8px}
nav{display:flex;gap:4px;padding:8px 8px 10px;border-top:1px solid var(--line);background:var(--bg)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;font-weight:600;padding:10px 0;border-radius:10px;cursor:pointer}
nav button.on{color:var(--fg);box-shadow:inset 0 -3px 0 var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0;touch-action:pan-y;user-select:none;position:relative}
.row{display:flex;gap:10px;align-items:center}
.wave{display:flex;gap:3px;align-items:center;height:44px;flex:1}
.wave i{flex:1;background:var(--mut);border-radius:3px;display:block}
.play{width:56px;height:56px;border-radius:50%;border:2px solid var(--fg);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer;flex:none}
.stamp{position:absolute;top:12px;font-weight:800;font-size:22px;opacity:0;border:3px solid;border-radius:8px;padding:2px 8px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:10px 0}
.stat{display:flex;gap:10px}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:13px;color:var(--mut)}
.stat b{display:block;font-size:28px;color:var(--fg)}
input,select{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
.rec{display:flex;align-items:center;justify-content:center;position:relative;margin:6px 0}
.ring{width:min(70vw,260px)}
.rec button{position:absolute;width:60%;aspect-ratio:1;border-radius:50%;border:0;background:var(--red);color:#fff;font:inherit;font-weight:800;font-size:20px;cursor:pointer}
.sec{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.langs{display:flex;gap:8px;margin:12px 0}.lg{flex:1;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);font:inherit;font-weight:700;cursor:pointer}.lg.on{background:var(--fg);color:var(--bg)}
.chip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;margin:4px 4px 4px 0;background:var(--card)}
.chip button{border:0;background:none;color:var(--mut);font-size:18px;cursor:pointer}
#wel{position:fixed;inset:0;background:var(--bg);z-index:5;padding:max(28px,env(safe-area-inset-top)) 20px 20px;max-width:480px;margin:0 auto;overflow-y:auto}
.meter{height:8px;background:var(--line);border-radius:4px;margin:8px 0;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--red)}
details.tx{margin-top:6px}details.tx summary{cursor:pointer;color:var(--mut);font-size:14px;padding:8px 0;text-decoration:underline}details.tx p{margin:4px 0 0}
textarea{width:100%;min-height:76px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
[hidden]{display:none!important}
.twist{background:var(--yel);color:#111;border-radius:12px;padding:12px 14px;font-weight:700;margin:6px 0 16px}
.about{line-height:1.5;margin:6px 0 12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<div id="wel">
  <h1>Sell or Die</h1><p class="tag" data-i="tag"></p>
  <div class="langs"><button class="lg" data-l="en">English</button><button class="lg" data-l="ru">Русский</button><button class="lg" data-l="lt">Lietuvių</button></div>
  <h2 data-i="wtitle"></h2><p class="tag" data-i="wsub"></p>
  <button class="btn" id="wg" data-i="gbtn"></button>
  <button class="btn g" id="we" data-i="ebtn"></button>
  <div id="emb" hidden><input id="wem" type="email" autocomplete="email" inputmode="email" data-ph="emailph" aria-label="Email"><button class="btn" id="wsend" data-i="sendlink"></button></div>
  <div class="small" style="text-align:center;margin:14px 0 8px" data-i="or"></div>
  <input id="wnick" maxlength="16" data-ph="nickph" aria-label="Nickname">
  <button class="btn g" id="wgo" data-i="wbtn"></button>
</div>
<main>
<section id="home" class="scr on">
  <h1>Sell or Die</h1><p class="tag" data-i="tag"></p>
  <div class="small" data-i="today"></div><div class="item" id="item"></div>
  <div class="small" data-i="twistlbl"></div><div class="twist" id="twist"></div>
  <div class="small" data-i="next"></div><div class="count" id="cd"></div>
  <button class="btn" id="goRec"></button>
  <button class="btn g" id="goFeed" data-i="judge"></button>
  <button class="btn g" id="share" data-i="share"></button>
</section>
<section id="rec" class="scr">
  <h2 id="recItem"></h2><p class="twist" id="recTwist" hidden></p><p class="tag" id="recHint"></p>
  <select id="micSel" hidden aria-label="Microphone" style="margin-bottom:8px"></select><div class="rec"><svg class="ring" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--line)" stroke-width="6"/><circle id="arc" cx="60" cy="60" r="54" fill="none" stroke="#d4171e" stroke-width="6" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3" transform="rotate(-90 60 60)"/></svg><button id="recBtn"></button></div>
  <div class="sec" id="sec">0:15</div><div class="meter"><i id="lvl"></i></div>
  <button class="btn g" id="uplBtn" hidden data-i="upl"></button><input type="file" id="file" accept="audio/*,video/*" hidden><button class="btn g" id="openBr" hidden data-i="openbr"></button>
  <div id="after" hidden><div class="small" data-i="txlbl"></div><textarea id="rtext" maxlength="400" aria-label="Text"></textarea><button class="btn g" id="prev" data-i="playme"></button><button class="btn" id="post"></button><button class="btn g" id="redo"></button></div>
  <button class="link" id="recBack" data-i="back"></button>
</section>
<section id="feed" class="scr">
  <h2 data-i="ftitle"></h2><p class="tag" id="feedTag"></p>
  <div id="stack"></div>
  <div class="row" id="vbtns"><button class="btn g" id="dead" style="margin:0"></button><button class="btn" id="sold" style="margin:0"></button></div>
</section>
<section id="results" class="scr">
  <h2 data-i="rtitle"></h2><p class="tag" id="yItem"></p>
  <div id="podium"></div><div class="card" id="mine"></div>
  <button class="btn g" id="ff" data-i="ff"></button>
</section>
<section id="top" class="scr"><h2 data-i="ttitle"></h2><p class="tag" data-i="tsub"></p><div id="topList"></div></section>
<section id="friends" class="scr"><h2 data-i="nf"></h2><div id="fbody"></div></section>
<section id="me" class="scr">
  <h2 id="nick"></h2><div class="small" id="acct"></div><button class="btn g" id="acctBtn" style="margin:8px 0 14px"></button>
  <div class="stat"><div><b id="stStreak">0</b><span data-i="streak"></span></div><div><b id="stWins">0</b><span data-i="wins"></span></div><div><b id="stVotes">0</b><span data-i="vts"></span></div></div>
  <p></p><input id="nickIn" maxlength="16" data-ph="nickph" aria-label="Nickname">
  <div class="small" style="margin-top:14px" data-i="lang"></div>
  <div class="langs"><button class="lg" data-l="en">English</button><button class="lg" data-l="ru">Русский</button><button class="lg" data-l="lt">Lietuvių</button></div>
  <button class="btn g" id="theme" data-i="theme"></button>
  <h2 style="font-size:18px;margin-top:18px" data-i="abouth"></h2><p class="about" data-i="aboutp"></p>
  <h2 style="font-size:18px;margin-top:18px" data-i="hist"></h2><div id="hist"></div>
  <button class="link" id="resLink" data-i="rtitle"></button>
</section>
</main>
<nav id="nav"><button data-s="home" data-i="nh"></button><button data-s="feed" data-i="nj"></button><button data-s="friends" data-i="nf"></button><button data-s="top" data-i="nt"></button><button data-s="me" data-i="nm"></button></nav>
<div class="toast" id="toast"></div>

aboutp:["Selling is thinking under pressure. In 15 seconds you have to find one strong idea, say it clearly, and make a stranger care. Practicing this every hour trains quick thinking, clear speech and persuasion. These skills help in interviews, startups, negotiations and everyday life. I built Sell or Die as a student of a sales course, because the best way to learn selling is to do it often, and it should be fun.","Продажа — это мышление под давлением. За 15 секунд нужно найти одну сильную идею, чётко её сказать и заинтересовать незнакомца. Если тренироваться каждый час, развиваются быстрое мышление, ясная речь и умение убеждать. Эти навыки пригодятся на собеседованиях, в стартапах, на переговорах и в обычной жизни. Я сделал Sell or Die как студент курса по продажам: лучше всего учишься, когда делаешь это часто, и пусть это будет весело.","Pardavimai – tai mąstymas spaudžiant laikui. Per 15 sekundžių reikia rasti vieną stiprią idėją, aiškiai ją pasakyti ir sudominti nepažįstamąjį. Treniruojantis kas valandą lavėja greitas mąstymas, aiški kalba ir įtikinimo gebėjimai. Šie įgūdžiai praverčia pokalbiuose dėl darbo, startuoliuose, derybose ir kasdienybėje. Sukūriau „Sell or Die“ kaip pardavimų kurso studentas: geriausiai mokaisi darydamas tai dažnai, ir tegul tai bus smagu."],

 $("#podium").innerHTML=rows.map((r,i)=>`<div class="card row"><b style="font-size:26px;color:var(--red);width:30px">${i+1}</b><div>${r[0]}<div class="small">${t("pct",Math.round(r[1]/(r[1]+r[2])*100),r[1]+r[2])}</div></div></div>`).join("");
 const h=S.hist.find(x=>x.slot===slot-1),box=$("#mine");
 if(h){box.style.display="block";box.textContent=h.rank?t("rrank",h.rank):t("rpend")}else box.style.display="none"}
$("#ff").onclick=()=>{off+=HOUR;rollover();show("results")};
function renderTop(){const l=weekly.slice().sort((a,b)=>wilson(b[3],b[3]+b[4])-wilson(a[3],a[3]+a[4]));
 $("#topList").innerHTML=l.map((p,i)=>`<div class="card row"><b style="font-size:22px;color:var(--red);width:28px">${i+1}</b><div style="flex:1"><b>${iName(p[1])}</b><div class="small">${p[0]} · ${t("pct",Math.round(p[3]/(p[3]+p[4])*100),p[3]+p[4])}</div>${txt(p[2])}</div><button class="play" style="width:48px;height:48px" data-i2="${i}" aria-label="Play">▶</button></div>`).join("");
 $$("[data-i2]").forEach(b=>b.onclick=()=>play({text:l[b.dataset.i2][2]},b))}
function renderMe(){$("#nick").textContent=S.nick;$("#acct").textContent=S.user?t("signedas",S.user.email||S.nick):t("anonacct");$("#acctBtn").textContent=S.user?t("signout"):t("signin");$("#stStreak").textContent=S.streak;$("#stWins").textContent=S.wins;$("#stVotes").textContent=S.votes;
 $("#hist").innerHTML=S.hist.length?S.hist.map(h=>`<div class="card"><b>${iName(h.idx)}</b><div class="small">${h.rank?t("rank",h.rank):t("inplay")}</div></div>`).join(""):`<div class="card small">${t("nohist")}</div>`}
$("#nickIn").onchange=e=>{const v=e.target.value.trim();if(v){S.nick=v;e.target.value="";renderMe();toast(t("saved"))}};
$("#theme").onclick=()=>{const d=getComputedStyle(document.body).backgroundColor==="rgb(16, 16, 16)";document.documentElement.dataset.theme=d?"light":"dark"};
$("#resLink").onclick=()=>show("results");
/* friends: pass-and-play */
let F={ph:"setup",pl:[],i:0,v:0},CH={};
function renderFriends(){const b=$("#fbody");
 if(F.ph==="setup"){
  b.innerHTML=`<p class="tag">${t("fsub")}</p><div class="row"><input id="fn" maxlength="14" placeholder="${t("fname")}" aria-label="${t("fname")}"><button class="btn sm" id="fa" style="flex:none;padding:0 18px">${t("fadd")}</button></div><div id="chips" style="margin:8px 0">${F.pl.map((p,i)=>`<span class="chip">${esc(p.name)}<button data-x="${i}" aria-label="Remove">×</button></span>`).join("")}</div><button class="btn" id="fs">${t("fstart")}</button><p class="small">${t("fnote")}</p>`;
  const add=()=>{const v=$("#fn").value.trim();if(v&&F.pl.length<6){F.pl.push({name:v,score:0});renderFriends();$("#fn").focus()}};
  $("#fa").onclick=add;$("#fn").onkeydown=e=>e.key==="Enter"&&add();
  $$("[data-x]").forEach(x=>x.onclick=()=>{F.pl.splice(+x.dataset.x,1);renderFriends()});
  $("#fs").onclick=()=>{if(F.pl.length<3){toast(t("fmin"));return}
   const pool=Array.from({length:lang==="en"?ITEMS.length:30},(_,i)=>i).sort(()=>Math.random()-.5);
   F.pl.forEach((p,i)=>{p.item=iName(pool[i]);p.score=0;p.url=null});F.ph="turn";F.i=0;renderFriends()}}
 else if(F.ph==="turn"){const p=F.pl[F.i];
  b.innerHTML=`<p class="tag">${t("fpass",esc(p.name))}</p><div class="small">${t("fword")}</div><div class="item">${esc(p.item)}.</div><button class="btn" id="fr">${t("fready")}</button>`;
  $("#fr").onclick=()=>openRec(p.item,(bl,tx)=>{p.url=URL.createObjectURL(bl);p.text=tx;F.i++;if(F.i>=F.pl.length){F.ph="vote";F.v=0}show("friends")},"friends")}
 else if(F.ph==="vote"){CH={};const me=F.pl[F.v];
  b.innerHTML=`<p class="tag"><b>${t("fvote",esc(me.name))}</b><br>${t("fvsub")}</p>${F.pl.map((p,i)=>i===F.v?"":`<div class="card"><div class="row"><button class="play" data-pi="${i}" aria-label="Play">▶</button><b style="flex:1">${esc(p.item)}</b></div>${txt(p.text)}<div class="row" style="margin-top:10px"><button class="btn sm g" data-b="${i}">${t("best")}</button><button class="btn sm g" data-w="${i}">${t("worst")}</button></div></div>`).join("")}<button class="btn" id="fsub" disabled>${t("submit")}</button>`;
  const upd=()=>{$$("[data-b]").forEach(x=>x.classList.toggle("sel",+x.dataset.b===CH.b));$$("[data-w]").forEach(x=>x.classList.toggle("sel",+x.dataset.w===CH.w));$("#fsub").disabled=CH.b===undefined||CH.w===undefined};
  $$("[data-pi]").forEach(x=>x.onclick=()=>play(F.pl[x.dataset.pi],x));
  $$("[data-b]").forEach(x=>x.onclick=()=>{CH.b=+x.dataset.b;if(CH.w===CH.b)CH.w=undefined;upd()});
  $$("[data-w]").forEach(x=>x.onclick=()=>{CH.w=+x.dataset.w;if(CH.b===CH.w)CH.b=undefined;upd()});
  $("#fsub").onclick=()=>{stopPlay();F.pl[CH.b].score++;F.pl[CH.w].score--;F.v++;if(F.v>=F.pl.length)F.ph="res";renderFriends();$("main").scrollTop=0}}
 else{const r=F.pl.slice().sort((a,b)=>b.score-a.score);
  b.innerHTML=`<p class="tag">${t("fres")}</p>${r.map((p,i)=>`<div class="card row"><b style="font-size:22px;color:var(--red);width:28px">${i+1}</b><div style="flex:1"><b>${esc(p.name)}</b><div class="small">${esc(p.item)} · ${t("pts",p.score)}</div>${txt(p.text)}</div><button class="play" style="width:48px;height:48px" data-pi="${F.pl.indexOf(p)}" aria-label="Play">▶</button></div>`).join("")}<button class="btn" id="fnw">${t("fnew")}</button>`;
  $$("[data-pi]").forEach(x=>x.onclick=()=>play(F.pl[x.dataset.pi],x));
  $("#fnw").onclick=()=>{F={ph:"setup",pl:F.pl.map(p=>({name:p.name,score:0})),i:0,v:0};renderFriends()}}}

 AUTH.onAuthStateChanged(u=>{if(!u)return;S.user=u;S.nick=nickFrom(u);if(!$("#wel").hidden)enter();else renderMe()});

 try{if(navigator.share){await navigator.share({title:"Sell or Die",text:msg,url});return}}catch(e){if(e&&e.name==="AbortError")return}
